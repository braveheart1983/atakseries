name: Update Series JSON

on:
  push:
    paths:
      - 'diziler/*.json'   # diziler klasörüne JSON eklenince çalışır
  workflow_dispatch:        # Manuel çalıştırma için

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Run merge script
        run: python github_series_merger.py
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Otomatik güncelleme: JSON dosyaları yenilendi"
          git push
