name: ShowTV Güncelle

on:
  schedule:
    # Her Pazar günü saat 03:15'te çalışır (UTC)
    - cron: '15 3 * * 0'
  workflow_dispatch:        # Manuel çalıştırma için

jobs:
  update-showtv:
    runs-on: ubuntu-latest
    name: ShowTV Dizilerini Güncelle
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Run ShowTV updater
        run: python showtv.py
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"  # ✅ DÜZELTİLDİ
          git add diziler/showtv.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 ShowTV: Otomatik güncelleme"
          git push
